# nginx location blocks for velocity-wp-install-automation
# Sumber kebenaran untuk blok di /etc/nginx/conf.d/n8n.conf (server pckantor.my.id).
# Deploy manual: salin blok location di bawah ke dalam server block, lalu
#   nginx -t && systemctl reload nginx

# ---- installer status API (port 9121) ----
location = /api/installer/run {
    proxy_pass http://127.0.0.1:9121/api/installer/run;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /api/installer {
    proxy_pass http://127.0.0.1:9121/api/installer;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /api/servers {
    proxy_pass http://127.0.0.1:9121/api/servers;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /installer { return 301 /installer/; }
location /installer/ { try_files $uri $uri/ =404; }
